name: OpenWrt-Matrix

on:
  workflow_call:
    inputs:
      targets:
        required: false
        type: string
        default: "X86"
      upstream:
        required: false
        type: string
        default: "openwrt"
      version:
        required: false
        type: string
        default: "latest"

  workflow_dispatch:
    inputs:
      targets:
        description: "Select target platforms (comma separated, e.g. X86,R2S,R2C,R3S,R4S ; default: X86)"
        required: false
        type: string
        default: "X86"
      upstream:
        description: "ImageBuilder source"
        required: false
        type: choice
        options:
          - openwrt
          - immortalwrt
          - istoreos
        default: openwrt
      version:
        description: "OpenWrt version (e.g. 25.12.6 or leave blank for latest 25.x)"
        required: false
        type: string
        default: "latest"

permissions:
  contents: write

jobs:
  setup:
    name: Setup Build Matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      version: ${{ steps.resolve-ver.outputs.version }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Resolve Upstream Version
        id: resolve-ver
        shell: bash
        run: |
          req="${{ inputs.version }}"
          upstream="${{ inputs.upstream }}"
          [ -n "$upstream" ] || upstream="openwrt"
          if [ "$upstream" = "istoreos" ]; then
            echo "Resolved istoreos version: snapshot"
            echo "version=snapshot" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$upstream" in
            immortalwrt)
              base_url="https://downloads.immortalwrt.org"
              git_url="https://github.com/immortalwrt/immortalwrt.git"
              ;;
            *)
              base_url="https://downloads.openwrt.org"
              git_url="https://github.com/openwrt/openwrt.git"
              ;;
          esac
          default_major="25.12"
          [ -n "$req" ] && [ "$req" != "latest" ] || req="$default_major"

          versions=$(curl -fsSL --retry 3 "${base_url}/releases/" 2>/dev/null | \
            grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?/"' | \
            sed 's/href="//;s/\///;s/"//' | sort -V || true)

          if [ -z "$versions" ]; then
            versions=$(git ls-remote --tags --refs "$git_url" 2>/dev/null | awk -F'/' '{print $NF}' | sed 's/^v//' || true)
          fi

          resolved=""
          if echo "$versions" | grep -qx "$req"; then
            resolved="$req"
          else
            escaped_req="${req//./\\.}"
            resolved=$(echo "$versions" | grep -E "^${escaped_req}\.[0-9]+" | grep -v 'rc' | sort -V | tail -n 1 || true)
            if [ -z "$resolved" ]; then
              resolved=$(echo "$versions" | grep -E "^${escaped_req}" | grep -v 'rc' | sort -V | tail -n 1 || true)
            fi
          fi

          [ -n "$resolved" ] || resolved="${req:-25.12.6}"
          echo "Resolved ${upstream} version: ${resolved}"
          echo "version=${resolved}" >> "$GITHUB_OUTPUT"

      - name: Calculate Target Matrix
        id: set-matrix
        shell: bash
        run: |
          all_targets='[
            {"name": "X86", "target": "x86", "subtarget": "64", "profile": "generic", "packages_profile": "packages.x86_64", "upstream": "openwrt"},
            {"name": "R2S", "target": "rockchip", "subtarget": "armv8", "profile": "friendlyarm_nanopi-r2s", "packages_profile": "packages.rockchip", "upstream": "openwrt"},
            {"name": "R2C", "target": "rockchip", "subtarget": "armv8", "profile": "friendlyarm_nanopi-r2c", "packages_profile": "packages.rockchip", "upstream": "openwrt"},
            {"name": "R3S", "target": "rockchip", "subtarget": "armv8", "profile": "friendlyarm_nanopi-r3s", "packages_profile": "packages.rockchip", "upstream": "openwrt"},
            {"name": "R4S", "target": "rockchip", "subtarget": "armv8", "profile": "friendlyarm_nanopi-r4s", "packages_profile": "packages.rockchip", "upstream": "openwrt"}
          ]'

          inputs_targets="${{ inputs.targets }}"
          inputs_targets=$(echo "$inputs_targets" | sed 's/，/,/g' | tr 'a-z' 'A-Z' | xargs)

          # Empty input means X86 only; list names explicitly to build more.
          [ -n "$inputs_targets" ] || inputs_targets="X86"

          inputs_upstream="${{ inputs.upstream }}"
          [ -n "$inputs_upstream" ] || inputs_upstream="openwrt"

          filtered=$(echo "$all_targets" | jq --arg targets "$inputs_targets" --arg upstream "$inputs_upstream" '[.[] | select(.name as $name | ($targets | split(",") | map(gsub(" "; "")) | index($name))) | .upstream = $upstream ]')
          echo "matrix=$(echo "$filtered" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }} (${{ matrix.upstream }} ${{ needs.setup.outputs.version }})
    needs: setup
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Install Host Dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential zstd curl wget jq file rsync \
            libncurses5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc \
            qemu-utils genisoimage
          sudo ln -sf /usr/bin/genisoimage /usr/local/bin/mkisofs

      - name: Assemble Firmware via ImageBuilder
        shell: bash
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh \
            "${{ matrix.target }}" \
            "${{ matrix.subtarget }}" \
            "${{ matrix.profile }}" \
            "${{ matrix.packages_profile }}" \
            "${{ needs.setup.outputs.version }}" \
            "${{ matrix.upstream }}"

      - name: Upload Artifacts to Job
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.upstream }}-${{ matrix.name }}-${{ needs.setup.outputs.version }}
          path: |
            artifact/*.img.gz
            artifact/*.iso
          if-no-files-found: error
          retention-days: 7

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: ncipollo/release-action@v1
        with:
          name: ${{ matrix.upstream }}-${{ needs.setup.outputs.version }}
          body: |
            ## op-ib ${{ matrix.upstream }} ${{ needs.setup.outputs.version }}

            基于 ${{ matrix.upstream }} 官方 ImageBuilder 构建的 ${{ matrix.name }} 固件。

            ### 产物
            - `*combined-efi.img.gz`：UEFI 启动镜像（squashfs / ext4 视上游而定）
            - `*image.iso` / `*image-efi.iso`：BIOS / UEFI 安装镜像

            ### 默认配置
            - 管理地址：http://10.1.1.2
            - 主机名：使用上游默认
            - ttyd：http://10.1.1.2:7681（免登录）

            ### 说明
            - 资产文件名包含构建日期；同一 tag 仅保留最近 3 次构建。
            - FlowCone 提供 UDP Full-Cone NAT。
            - ImmortalWrt 额外启用 firewall4 fullcone（TCP/非 UDP）。
            - 问题反馈：https://github.com/xujw-org/op-ib/issues
          tag: ${{ matrix.upstream }}-${{ needs.setup.outputs.version }}
          commit: ${{ github.sha }}
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "artifact/*.img.gz,artifact/*.iso"
